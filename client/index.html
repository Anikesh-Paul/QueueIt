<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Campus virtual queues — join a line, watch your place, and show up when it's your turn."
    />
    <meta name="theme-color" content="#1b4332" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QueueIt" />
    <title>QueueIt</title>
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.js).
      (function () {
        try {
          var pref = localStorage.getItem("queueit_theme");
          var dark = pref === "dark" || ((pref !== "light") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#141412");
          }
        } catch (e) {}
        // Language before first paint (mirrors src/lib/i18n.js): saved choice, else the browser's.
        try {
          var locales = ["en", "hi", "bn"];
          var pick = function (tag) {
            tag = String(tag || "").toLowerCase();
            for (var i = 0; i < locales.length; i++) {
              if (tag === locales[i] || tag.indexOf(locales[i] + "-") === 0) return locales[i];
            }
            return null;
          };
          var lang = pick(localStorage.getItem("queueit_locale"));
          var prefs = navigator.languages || [navigator.language];
          for (var j = 0; !lang && j < prefs.length; j++) lang = pick(prefs[j]);
          document.documentElement.lang = lang || "en";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
